<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fyware Dashboard Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #2B2E2E;
    --accent: #E83833;
    --card: #383C3C;
    --card-hover: #414545;
    --border: #4A4E4E;
    --text: #F2F2F0;
    --text-dim: #B8BBBA;
    --text-faint: #8A8D8C;
    --ok: #4CAF7D;
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "DM Sans", system-ui, sans-serif;
  }

  button { font-family: inherit; cursor: pointer; }

  /* ============ HEADER ============ */
  .site-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 22px 32px 10px;
    max-width: 1280px;
    margin: 0 auto;
  }
  .logo-mark {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 20px;
    color: #fff;
    flex-shrink: 0;
  }
  .site-title { font-size: 20px; font-weight: 700; letter-spacing: -0.2px; }
  .site-sub { font-size: 13px; color: var(--text-dim); margin-top: 1px; }

  /* ============ TOOLBAR (busqueda + tags) ============ */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    padding: 14px 32px 6px;
    max-width: 1280px;
    margin: 0 auto;
  }
  .search-box {
    flex: 1 1 260px;
    max-width: 380px;
    position: relative;
  }
  .search-box input {
    width: 100%;
    padding: 10px 14px 10px 38px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box input::placeholder { color: var(--text-faint); }
  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    color: var(--text-faint);
    pointer-events: none;
  }
  .tag-filters { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag-chip {
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 500;
    transition: all .15s ease;
  }
  .tag-chip:hover { border-color: var(--text-dim); color: var(--text); }
  .tag-chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* ============ GALERIA ============ */
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px;
    padding: 18px 32px 110px;
    max-width: 1280px;
    margin: 0 auto;
  }
  .card {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    transition: background .15s ease, border-color .15s ease, transform .15s ease;
    position: relative;
  }
  .card:not(.pending):hover {
    background: var(--card-hover);
    border-color: #5A5E5E;
    transform: translateY(-2px);
  }
  .card.selected { border-color: var(--accent); }
  .card.pending { opacity: 0.65; }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }
  .card-title { font-size: 16px; font-weight: 600; line-height: 1.3; }
  .card-desc {
    font-size: 13.5px;
    color: var(--text-dim);
    line-height: 1.5;
    margin-top: 8px;
    flex-grow: 1;
  }
  .card-footer {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
  }
  .card-tag {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(232, 56, 51, 0.14);
    color: #F07572;
  }
  .card-edited {
    font-size: 12px;
    color: var(--text-faint);
    margin-left: auto;
  }
  .pending-badge {
    font-size: 11.5px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-faint);
    border: 1px dashed var(--border);
  }
  .card-open-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 14px;
    padding: 8px 14px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 13px;
    font-weight: 500;
    align-self: flex-start;
    transition: all .15s ease;
  }
  .card-open-btn:hover { border-color: var(--accent); color: #fff; }
  .card-open-btn svg { width: 13px; height: 13px; }

  /* checkbox custom */
  .card-check {
    appearance: none;
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 7px;
    border: 2px solid var(--border);
    background: transparent;
    cursor: pointer;
    flex-shrink: 0;
    position: relative;
    transition: all .12s ease;
  }
  .card-check:hover:not(:disabled) { border-color: var(--accent); }
  .card-check:checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  .card-check:checked::after {
    content: "";
    position: absolute;
    left: 6px;
    top: 2px;
    width: 5px;
    height: 10px;
    border: solid #fff;
    border-width: 0 2.5px 2.5px 0;
    transform: rotate(45deg);
  }
  .card-check:disabled { cursor: not-allowed; opacity: 0.4; }

  .empty-state {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    padding: 60px 20px;
    color: var(--text-faint);
    font-size: 15px;
  }

  /* ============ BOTON FLOTANTE ============ */
  .fab {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    padding: 14px 28px;
    border-radius: 999px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    transition: opacity .2s ease, transform .2s ease;
    z-index: 50;
  }
  .fab:hover { transform: translateX(-50%) scale(1.04); }
  .fab:disabled {
    background: var(--card);
    color: var(--text-faint);
    cursor: not-allowed;
    box-shadow: none;
  }
  .fab:disabled:hover { transform: translateX(-50%); }

  /* ============ LANZADOR (overlay) ============ */
  .launcher-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .launcher-backdrop.open { display: flex; }
  .launcher {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    width: 100%;
    max-width: 520px;
    max-height: 80vh;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    overflow: hidden;
  }
  .launcher-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .launcher-title { font-size: 16px; font-weight: 700; flex: 1; }
  .launcher-close {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .launcher-close:hover { background: rgba(255, 255, 255, 0.08); color: var(--text); }

  .popup-warn {
    display: none;
    gap: 10px;
    align-items: flex-start;
    margin: 14px 20px 0;
    padding: 12px 14px;
    border-radius: 10px;
    background: rgba(232, 56, 51, 0.12);
    border: 1px solid rgba(232, 56, 51, 0.4);
    font-size: 13px;
    line-height: 1.5;
    color: var(--text-dim);
  }
  .popup-warn.visible { display: flex; }
  .popup-warn strong { color: var(--text); }

  .launch-list {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 8px;
    padding: 16px 20px;
    overflow-y: auto;
  }
  .launch-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
  }
  .launch-row-title {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .launch-status {
    font-size: 12px;
    font-weight: 600;
    color: var(--ok);
    display: none;
    align-items: center;
    gap: 5px;
  }
  .launch-status.visible { display: flex; }
  .launch-btn {
    padding: 8px 16px;
    border-radius: 9px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
  }
  .launch-btn:hover { filter: brightness(1.1); }
  .launch-btn.done { display: none; }

  .launcher-foot {
    display: flex;
    gap: 10px;
    padding: 14px 20px 18px;
    border-top: 1px solid var(--border);
  }
  .open-all-btn {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
  }
  .open-all-btn:hover { filter: brightness(1.1); }

  @media (max-width: 900px) {
    .gallery { padding: 18px 18px 110px; }
    .site-header, .toolbar { padding-left: 18px; padding-right: 18px; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="logo-mark">F</div>
  <div>
    <div class="site-title">Fyware Dashboard Hub</div>
    <div class="site-sub">Dashboards comerciales en vivo</div>
  </div>
</header>

<div class="toolbar">
  <div class="search-box">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
    </svg>
    <input type="text" id="searchInput" placeholder="Buscar dashboard...">
  </div>
  <div class="tag-filters" id="tagFilters"></div>
</div>

<main class="gallery" id="gallery"></main>

<button class="fab" id="fab" disabled>Abrir seleccionados (0)</button>

<div class="launcher-backdrop" id="launcherBackdrop">
  <div class="launcher">
    <div class="launcher-head">
      <span class="launcher-title">Abrir dashboards</span>
      <button class="launcher-close" id="launcherClose" title="Cerrar" aria-label="Cerrar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div class="popup-warn" id="popupWarn">
      <span>
        <strong>Tu navegador bloqueo algunas ventanas.</strong>
        Permite las ventanas emergentes de este sitio (icono en la barra de direcciones)
        o abre cada dashboard con su boton.
      </span>
    </div>
    <div class="launch-list" id="launchList"></div>
    <div class="launcher-foot">
      <button class="open-all-btn" id="openAllBtn">Abrir todos</button>
    </div>
  </div>
</div>

<script>
// ================================================================
// DASHBOARDS: para agregar uno nuevo, copia un objeto y pega su URL
// publica de Claude (https://claude.ai/public/artifacts/...).
// Los dashboards abren en pestana nueva; requieren sesion de Claude
// para mostrar datos. Ver README.
// ================================================================
const DASHBOARDS = [
  {
    id: "leads-paid-social",
    titulo: "Leads Paid Social",
    descripcion: "Leads generados por campañas de paid social con costo por lead y conversion a oportunidad.",
    url: "https://claude.ai/public/artifacts/019f679c-abf8-7320-b014-4cf7c24704b9",
    tags: ["Marketing"],
    editado: "hoy"
  },
  {
    id: "reporte-semanal-mkt",
    titulo: "Reporte Semanal MKT",
    descripcion: "Resumen semanal de marketing: campañas activas, leads, inversion y resultados.",
    url: "https://claude.ai/public/artifacts/019f199c-123c-72b8-a914-a1d25d13a3d2",
    tags: ["Marketing", "Reportes"],
    editado: "hoy"
  },
  {
    id: "deals-paid-social",
    titulo: "Deals Paid Social",
    descripcion: "Deals originados en paid social: etapa en el pipeline, montos y avance a cierre.",
    url: "https://claude.ai/public/artifacts/019f19a7-9eb2-7381-ad2c-931bff486dde",
    tags: ["Ventas"],
    editado: "hoy"
  },
  {
    id: "leads-no-paid-social",
    titulo: "Leads NO Paid Social",
    descripcion: "Leads de canales organicos y otros origenes fuera de paid social.",
    url: "https://claude.ai/public/artifacts/019f679d-bd11-76fa-8b6f-8d6452151b77",
    tags: ["Marketing"],
    editado: "hoy"
  }
];

// ---------------- Estado (solo en memoria) ----------------
const selected = new Set();
const openedIds = new Set();
let activeTag = null;
let searchText = "";

// ---------------- Referencias DOM ----------------
const galleryEl = document.getElementById("gallery");
const fabEl = document.getElementById("fab");
const tagFiltersEl = document.getElementById("tagFilters");
const searchInput = document.getElementById("searchInput");
const launcherBackdrop = document.getElementById("launcherBackdrop");
const launcherClose = document.getElementById("launcherClose");
const launchList = document.getElementById("launchList");
const openAllBtn = document.getElementById("openAllBtn");
const popupWarn = document.getElementById("popupWarn");

// ---------------- Filtros de tags ----------------
function renderTagFilters() {
  const allTags = [...new Set(DASHBOARDS.flatMap(d => d.tags))];
  tagFiltersEl.innerHTML = "";
  const allBtn = document.createElement("button");
  allBtn.className = "tag-chip" + (activeTag === null ? " active" : "");
  allBtn.textContent = "Todos";
  allBtn.onclick = () => { activeTag = null; renderTagFilters(); renderGallery(); };
  tagFiltersEl.appendChild(allBtn);
  allTags.forEach(tag => {
    const btn = document.createElement("button");
    btn.className = "tag-chip" + (activeTag === tag ? " active" : "");
    btn.textContent = tag;
    btn.onclick = () => {
      activeTag = (activeTag === tag) ? null : tag;
      renderTagFilters();
      renderGallery();
    };
    tagFiltersEl.appendChild(btn);
  });
}

// ---------------- Galeria ----------------
function matchesFilters(d) {
  if (activeTag && !d.tags.includes(activeTag)) return false;
  if (searchText) {
    const t = searchText.toLowerCase();
    const haystack = (d.titulo + " " + d.descripcion + " " + d.tags.join(" ")).toLowerCase();
    if (!haystack.includes(t)) return false;
  }
  return true;
}

function renderGallery() {
  galleryEl.innerHTML = "";
  const visible = DASHBOARDS.filter(matchesFilters);

  if (visible.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty-state";
    empty.textContent = "No hay dashboards que coincidan con la busqueda.";
    galleryEl.appendChild(empty);
    return;
  }

  visible.forEach(d => {
    const pending = !d.url;
    const card = document.createElement("article");
    card.className = "card" + (pending ? " pending" : "") + (selected.has(d.id) ? " selected" : "");

    const top = document.createElement("div");
    top.className = "card-top";

    const title = document.createElement("h2");
    title.className = "card-title";
    title.textContent = d.titulo;

    const check = document.createElement("input");
    check.type = "checkbox";
    check.className = "card-check";
    check.checked = selected.has(d.id);
    check.disabled = pending;
    check.title = pending ? "URL pendiente" : "Seleccionar dashboard";
    check.onchange = () => toggleSelect(d.id, check.checked);

    top.appendChild(title);
    top.appendChild(check);

    const desc = document.createElement("p");
    desc.className = "card-desc";
    desc.textContent = d.descripcion;

    card.appendChild(top);
    card.appendChild(desc);

    if (!pending) {
      const openBtn = document.createElement("button");
      openBtn.className = "card-open-btn";
      openBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><path d="M15 3h6v6"></path><path d="M10 14L21 3"></path></svg> Abrir';
      openBtn.onclick = () => window.open(d.url, "_blank", "noopener");
      card.appendChild(openBtn);
    }

    const footer = document.createElement("div");
    footer.className = "card-footer";
    d.tags.forEach(tag => {
      const t = document.createElement("span");
      t.className = "card-tag";
      t.textContent = tag;
      footer.appendChild(t);
    });
    if (pending) {
      const badge = document.createElement("span");
      badge.className = "pending-badge";
      badge.textContent = "URL pendiente";
      footer.appendChild(badge);
    }
    const edited = document.createElement("span");
    edited.className = "card-edited";
    edited.textContent = "Editado " + d.editado;
    footer.appendChild(edited);

    card.appendChild(footer);
    galleryEl.appendChild(card);
  });
}

function toggleSelect(id, isChecked) {
  if (isChecked) selected.add(id); else selected.delete(id);
  updateFab();
  renderGallery();
}

function updateFab() {
  const n = selected.size;
  fabEl.textContent = "Abrir seleccionados (" + n + ")";
  fabEl.disabled = n < 1;
}

// ---------------- Lanzador ----------------
function openLauncher() {
  const items = DASHBOARDS.filter(d => selected.has(d.id) && d.url);
  if (items.length === 0) return;

  openedIds.clear();
  popupWarn.classList.remove("visible");
  launchList.innerHTML = "";

  items.forEach(d => {
    const row = document.createElement("div");
    row.className = "launch-row";
    row.dataset.id = d.id;

    const title = document.createElement("span");
    title.className = "launch-row-title";
    title.textContent = d.titulo;

    const status = document.createElement("span");
    status.className = "launch-status";
    status.textContent = "Abierto";

    const btn = document.createElement("button");
    btn.className = "launch-btn";
    btn.textContent = "Abrir";
    btn.onclick = () => tryOpen(d, row);

    row.appendChild(title);
    row.appendChild(status);
    row.appendChild(btn);
    launchList.appendChild(row);
  });

  launcherBackdrop.classList.add("open");
  openAll();
}

function tryOpen(d, row) {
  const win = window.open(d.url, "_blank", "noopener");
  const ok = win !== null;
  if (ok) {
    openedIds.add(d.id);
    row.querySelector(".launch-status").classList.add("visible");
    row.querySelector(".launch-btn").classList.add("done");
  }
  return ok;
}

function openAll() {
  const items = DASHBOARDS.filter(d => selected.has(d.id) && d.url && !openedIds.has(d.id));
  let blocked = 0;
  items.forEach(d => {
    const row = launchList.querySelector('[data-id="' + d.id + '"]');
    if (row && !tryOpen(d, row)) blocked++;
  });
  popupWarn.classList.toggle("visible", blocked > 0);
}

function closeLauncher() {
  launcherBackdrop.classList.remove("open");
}

// ---------------- Eventos globales ----------------
fabEl.onclick = openLauncher;
openAllBtn.onclick = openAll;
launcherClose.onclick = closeLauncher;
launcherBackdrop.addEventListener("click", e => {
  if (e.target === launcherBackdrop) closeLauncher();
});
searchInput.addEventListener("input", e => {
  searchText = e.target.value.trim();
  renderGallery();
});

// ---------------- Init ----------------
renderTagFilters();
renderGallery();
updateFab();
</script>
</body>
</html>
