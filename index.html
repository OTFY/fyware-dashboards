<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fyware Dashboard Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #2B2E2E;
    --accent: #E83833;
    --card: #383C3C;
    --card-hover: #414545;
    --border: #4A4E4E;
    --text: #F2F2F0;
    --text-dim: #B8BBBA;
    --text-faint: #8A8D8C;
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "DM Sans", system-ui, sans-serif;
  }

  button { font-family: inherit; cursor: pointer; }

  /* ============ HEADER ============ */
  .site-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 22px 32px 10px;
    max-width: 1280px;
    margin: 0 auto;
  }
  .logo-mark {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 20px;
    color: #fff;
    flex-shrink: 0;
  }
  .site-title { font-size: 20px; font-weight: 700; letter-spacing: -0.2px; }
  .site-sub { font-size: 13px; color: var(--text-dim); margin-top: 1px; }

  /* ============ TOOLBAR (busqueda + tags) ============ */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    padding: 14px 32px 6px;
    max-width: 1280px;
    margin: 0 auto;
  }
  .search-box {
    flex: 1 1 260px;
    max-width: 380px;
    position: relative;
  }
  .search-box input {
    width: 100%;
    padding: 10px 14px 10px 38px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box input::placeholder { color: var(--text-faint); }
  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    color: var(--text-faint);
    pointer-events: none;
  }
  .tag-filters { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag-chip {
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 500;
    transition: all .15s ease;
  }
  .tag-chip:hover { border-color: var(--text-dim); color: var(--text); }
  .tag-chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* ============ GALERIA ============ */
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px;
    padding: 18px 32px 110px;
    max-width: 1280px;
    margin: 0 auto;
  }
  .card {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    transition: background .15s ease, border-color .15s ease, transform .15s ease;
    position: relative;
  }
  .card:not(.pending):hover {
    background: var(--card-hover);
    border-color: #5A5E5E;
    transform: translateY(-2px);
  }
  .card.selected { border-color: var(--accent); }
  .card.pending { opacity: 0.65; }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }
  .card-title { font-size: 16px; font-weight: 600; line-height: 1.3; }
  .card-desc {
    font-size: 13.5px;
    color: var(--text-dim);
    line-height: 1.5;
    margin-top: 8px;
    flex-grow: 1;
  }
  .card-footer {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
  }
  .card-tag {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(232, 56, 51, 0.14);
    color: #F07572;
  }
  .card-edited {
    font-size: 12px;
    color: var(--text-faint);
    margin-left: auto;
  }
  .pending-badge {
    font-size: 11.5px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-faint);
    border: 1px dashed var(--border);
  }

  /* checkbox custom */
  .card-check {
    appearance: none;
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 7px;
    border: 2px solid var(--border);
    background: transparent;
    cursor: pointer;
    flex-shrink: 0;
    position: relative;
    transition: all .12s ease;
  }
  .card-check:hover:not(:disabled) { border-color: var(--accent); }
  .card-check:checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  .card-check:checked::after {
    content: "";
    position: absolute;
    left: 6px;
    top: 2px;
    width: 5px;
    height: 10px;
    border: solid #fff;
    border-width: 0 2.5px 2.5px 0;
    transform: rotate(45deg);
  }
  .card-check:disabled { cursor: not-allowed; opacity: 0.4; }

  .empty-state {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    padding: 60px 20px;
    color: var(--text-faint);
    font-size: 15px;
  }

  /* ============ BOTON FLOTANTE ============ */
  .fab {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    padding: 14px 28px;
    border-radius: 999px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    transition: opacity .2s ease, transform .2s ease;
    z-index: 50;
  }
  .fab:hover { transform: translateX(-50%) scale(1.04); }
  .fab:disabled {
    background: var(--card);
    color: var(--text-faint);
    cursor: not-allowed;
    box-shadow: none;
  }
  .fab:disabled:hover { transform: translateX(-50%); }

  /* ============ VISTA MULTI-PANEL ============ */
  .viewer {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: none;
    flex-direction: column;
    justify-content: flex-start;
    z-index: 100;
  }
  .viewer.open { display: flex; }

  .viewer-topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .back-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 13.5px;
    font-weight: 500;
    transition: all .15s ease;
  }
  .back-btn:hover { border-color: var(--accent); }
  .viewer-count { font-size: 13px; color: var(--text-faint); }

  .panel-grid {
    flex: 1;
    display: grid;
    gap: 8px;
    padding: 8px;
    min-height: 0;
  }
  .panel-grid.cols-1 { grid-template-columns: 1fr; }
  .panel-grid.cols-2 { grid-template-columns: 1fr 1fr; }
  .panel-grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }

  .panel {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    min-height: 0;
  }
  .panel-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    background: #323636;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .panel-title {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  .panel-btn {
    width: 28px;
    height: 28px;
    border-radius: 7px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all .12s ease;
  }
  .panel-btn:hover { background: rgba(255, 255, 255, 0.08); color: var(--text); }
  .panel-btn.close-btn:hover { background: rgba(232, 56, 51, 0.2); color: var(--accent); }
  .panel-btn svg { width: 15px; height: 15px; }

  .panel-body { position: relative; flex: 1; min-height: 0; }
  .panel-body iframe {
    width: 100%;
    height: 100%;
    border: none;
    background: #fff;
    display: block;
  }

  .panel-loading, .panel-fallback {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    padding-top: 15vh;
    gap: 14px;
    background: var(--bg);
  }
  .spinner {
    width: 30px;
    height: 30px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .panel-loading span { font-size: 13px; color: var(--text-faint); }

  .panel-fallback { display: none; }
  .panel-fallback.visible { display: flex; }
  .panel-fallback p {
    font-size: 14px;
    color: var(--text-dim);
    text-align: center;
    max-width: 320px;
    line-height: 1.5;
  }
  .open-tab-btn {
    padding: 10px 20px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 13.5px;
    font-weight: 600;
  }
  .open-tab-btn:hover { filter: brightness(1.1); }

  @media (max-width: 900px) {
    .panel-grid.cols-2, .panel-grid.cols-3 { grid-template-columns: 1fr; }
    .gallery { padding: 18px 18px 110px; }
    .site-header, .toolbar { padding-left: 18px; padding-right: 18px; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="logo-mark">F</div>
  <div>
    <div class="site-title">Fyware Dashboard Hub</div>
    <div class="site-sub">Dashboards comerciales en vivo</div>
  </div>
</header>

<div class="toolbar">
  <div class="search-box">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
    </svg>
    <input type="text" id="searchInput" placeholder="Buscar dashboard...">
  </div>
  <div class="tag-filters" id="tagFilters"></div>
</div>

<main class="gallery" id="gallery"></main>

<button class="fab" id="fab" disabled>Ver seleccionados (0)</button>

<div class="viewer" id="viewer">
  <div class="viewer-topbar">
    <button class="back-btn" id="backBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path>
      </svg>
      Volver a galeria
    </button>
    <span class="viewer-count" id="viewerCount"></span>
  </div>
  <div class="panel-grid" id="panelGrid"></div>
</div>

<script>
// ================================================================
// DASHBOARDS: para agregar uno nuevo, copia un objeto y pega su URL
// publicada de Claude. Recuerda agregar "otfy.github.io" a los
// Allowed domains del artefacto en Claude (ver README).
// ================================================================
const DASHBOARDS = [
  {
    id: "leads-meta-ads",
    titulo: "Leads Meta Ads",
    descripcion: "Leads generados por campañas de Meta Ads con costo por lead y conversion a oportunidad.",
    url: "",
    tags: ["Marketing"],
    editado: "hace 2 dias"
  },
  {
    id: "pipeline-hubspot",
    titulo: "Pipeline HubSpot",
    descripcion: "Estado del pipeline comercial por etapa, monto ponderado y deals proximos a cerrar.",
    url: "",
    tags: ["Ventas"],
    editado: "hace 1 dia"
  },
  {
    id: "reporte-semanal",
    titulo: "Reporte Semanal",
    descripcion: "Resumen semanal de actividad comercial: llamadas, reuniones, propuestas y cierres.",
    url: "",
    tags: ["Reportes"],
    editado: "hace 5 dias"
  }
];

const MAX_PANELS = 6;

// ---------------- Estado (solo en memoria) ----------------
const selected = new Set();
let activeTag = null;
let searchText = "";

// ---------------- Referencias DOM ----------------
const galleryEl = document.getElementById("gallery");
const fabEl = document.getElementById("fab");
const tagFiltersEl = document.getElementById("tagFilters");
const searchInput = document.getElementById("searchInput");
const viewerEl = document.getElementById("viewer");
const panelGridEl = document.getElementById("panelGrid");
const viewerCountEl = document.getElementById("viewerCount");
const backBtn = document.getElementById("backBtn");

// ---------------- Filtros de tags ----------------
function renderTagFilters() {
  const allTags = [...new Set(DASHBOARDS.flatMap(d => d.tags))];
  tagFiltersEl.innerHTML = "";
  const allBtn = document.createElement("button");
  allBtn.className = "tag-chip" + (activeTag === null ? " active" : "");
  allBtn.textContent = "Todos";
  allBtn.onclick = () => { activeTag = null; renderTagFilters(); renderGallery(); };
  tagFiltersEl.appendChild(allBtn);
  allTags.forEach(tag => {
    const btn = document.createElement("button");
    btn.className = "tag-chip" + (activeTag === tag ? " active" : "");
    btn.textContent = tag;
    btn.onclick = () => {
      activeTag = (activeTag === tag) ? null : tag;
      renderTagFilters();
      renderGallery();
    };
    tagFiltersEl.appendChild(btn);
  });
}

// ---------------- Galeria ----------------
function matchesFilters(d) {
  if (activeTag && !d.tags.includes(activeTag)) return false;
  if (searchText) {
    const t = searchText.toLowerCase();
    const haystack = (d.titulo + " " + d.descripcion + " " + d.tags.join(" ")).toLowerCase();
    if (!haystack.includes(t)) return false;
  }
  return true;
}

function renderGallery() {
  galleryEl.innerHTML = "";
  const visible = DASHBOARDS.filter(matchesFilters);

  if (visible.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty-state";
    empty.textContent = "No hay dashboards que coincidan con la busqueda.";
    galleryEl.appendChild(empty);
    return;
  }

  visible.forEach(d => {
    const pending = !d.url;
    const card = document.createElement("article");
    card.className = "card" + (pending ? " pending" : "") + (selected.has(d.id) ? " selected" : "");

    const top = document.createElement("div");
    top.className = "card-top";

    const title = document.createElement("h2");
    title.className = "card-title";
    title.textContent = d.titulo;

    const check = document.createElement("input");
    check.type = "checkbox";
    check.className = "card-check";
    check.checked = selected.has(d.id);
    check.disabled = pending;
    check.title = pending ? "URL pendiente" : "Seleccionar dashboard";
    check.onchange = () => toggleSelect(d.id, check.checked);

    top.appendChild(title);
    top.appendChild(check);

    const desc = document.createElement("p");
    desc.className = "card-desc";
    desc.textContent = d.descripcion;

    const footer = document.createElement("div");
    footer.className = "card-footer";
    d.tags.forEach(tag => {
      const t = document.createElement("span");
      t.className = "card-tag";
      t.textContent = tag;
      footer.appendChild(t);
    });
    if (pending) {
      const badge = document.createElement("span");
      badge.className = "pending-badge";
      badge.textContent = "URL pendiente";
      footer.appendChild(badge);
    }
    const edited = document.createElement("span");
    edited.className = "card-edited";
    edited.textContent = "Editado " + d.editado;
    footer.appendChild(edited);

    card.appendChild(top);
    card.appendChild(desc);
    card.appendChild(footer);
    galleryEl.appendChild(card);
  });
}

function toggleSelect(id, isChecked) {
  if (isChecked) {
    if (selected.size >= MAX_PANELS) {
      alert("Maximo " + MAX_PANELS + " dashboards a la vez.");
      renderGallery();
      return;
    }
    selected.add(id);
  } else {
    selected.delete(id);
  }
  updateFab();
  renderGallery();
}

function updateFab() {
  const n = selected.size;
  fabEl.textContent = "Ver seleccionados (" + n + ")";
  fabEl.disabled = n < 1;
}

// ---------------- Vista multi-panel ----------------
function gridColsFor(n) {
  if (n <= 1) return 1;
  if (n === 2) return 2;
  if (n <= 4) return 2;
  return 3; // 5-6 => 3x2
}

function openViewer() {
  const items = DASHBOARDS.filter(d => selected.has(d.id) && d.url);
  if (items.length === 0) return;

  panelGridEl.className = "panel-grid cols-" + gridColsFor(items.length);
  panelGridEl.innerHTML = "";
  items.forEach(d => panelGridEl.appendChild(buildPanel(d)));
  viewerCountEl.textContent = items.length + (items.length === 1 ? " dashboard" : " dashboards");
  viewerEl.classList.add("open");
}

function buildPanel(d) {
  const panel = document.createElement("div");
  panel.className = "panel";
  panel.dataset.id = d.id;

  // barra superior
  const bar = document.createElement("div");
  bar.className = "panel-bar";

  const title = document.createElement("span");
  title.className = "panel-title";
  title.textContent = d.titulo;

  const reloadBtn = makePanelBtn(
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"></path><path d="M21 3v6h-6"></path></svg>',
    "Recargar"
  );
  const fsBtn = makePanelBtn(
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"></path><path d="M16 3h3a2 2 0 0 1 2 2v3"></path><path d="M8 21H5a2 2 0 0 1-2-2v-3"></path><path d="M16 21h3a2 2 0 0 0 2-2v-3"></path></svg>',
    "Pantalla completa"
  );
  const closeBtn = makePanelBtn(
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>',
    "Cerrar panel"
  );
  closeBtn.classList.add("close-btn");

  bar.appendChild(title);
  bar.appendChild(reloadBtn);
  bar.appendChild(fsBtn);
  bar.appendChild(closeBtn);

  // cuerpo con iframe + loading + fallback
  const body = document.createElement("div");
  body.className = "panel-body";

  const loading = document.createElement("div");
  loading.className = "panel-loading";
  loading.innerHTML = '<div class="spinner"></div><span>Cargando dashboard...</span>';

  const fallback = document.createElement("div");
  fallback.className = "panel-fallback";
  const fbText = document.createElement("p");
  fbText.textContent = "Este dashboard no cargo. Puede requerir sesion de Claude o que el dominio del hub este autorizado en el artefacto.";
  const fbBtn = document.createElement("button");
  fbBtn.className = "open-tab-btn";
  fbBtn.textContent = "Abrir en pestaña nueva";
  fbBtn.onclick = () => window.open(d.url, "_blank", "noopener");
  fallback.appendChild(fbText);
  fallback.appendChild(fbBtn);

  const iframe = document.createElement("iframe");
  iframe.title = d.titulo;
  iframe.setAttribute("loading", "eager");

  let timer = null;
  function load() {
    loading.style.display = "flex";
    fallback.classList.remove("visible");
    clearTimeout(timer);
    timer = setTimeout(() => {
      loading.style.display = "none";
      fallback.classList.add("visible");
    }, 8000);
    iframe.src = d.url;
  }
  iframe.addEventListener("load", () => {
    clearTimeout(timer);
    loading.style.display = "none";
    fallback.classList.remove("visible");
  });

  reloadBtn.onclick = () => { iframe.src = "about:blank"; requestAnimationFrame(load); };
  fsBtn.onclick = () => {
    if (document.fullscreenElement === panel) {
      document.exitFullscreen();
    } else if (panel.requestFullscreen) {
      panel.requestFullscreen();
    }
  };
  closeBtn.onclick = () => {
    clearTimeout(timer);
    selected.delete(d.id);
    updateFab();
    renderGallery();
    panel.remove();
    const remaining = panelGridEl.children.length;
    if (remaining === 0) {
      closeViewer();
    } else {
      panelGridEl.className = "panel-grid cols-" + gridColsFor(remaining);
      viewerCountEl.textContent = remaining + (remaining === 1 ? " dashboard" : " dashboards");
    }
  };

  body.appendChild(iframe);
  body.appendChild(loading);
  body.appendChild(fallback);
  panel.appendChild(bar);
  panel.appendChild(body);

  load();
  return panel;
}

function makePanelBtn(svg, label) {
  const btn = document.createElement("button");
  btn.className = "panel-btn";
  btn.innerHTML = svg;
  btn.title = label;
  btn.setAttribute("aria-label", label);
  return btn;
}

function closeViewer() {
  viewerEl.classList.remove("open");
  panelGridEl.innerHTML = "";
}

// ---------------- Eventos globales ----------------
fabEl.onclick = openViewer;
backBtn.onclick = closeViewer;
searchInput.addEventListener("input", e => {
  searchText = e.target.value.trim();
  renderGallery();
});

// ---------------- Init ----------------
renderTagFilters();
renderGallery();
updateFab();
</script>
</body>
</html>
